<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>PDF 工具箱</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#5c6ef8"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PDF工具箱"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0f1117; --surface:#181b26; --surface2:#21253a; --border:#272c45;
  --accent:#5c6ef8; --accent-light:#8b98ff; --accent-dim:rgba(92,110,248,.14);
  --text:#e8eaf6; --muted:#8b90b8; --green:#4caf92; --red:#e05c5c; --yellow:#f0c060;
  --r:12px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overscroll-behavior:none}

/* ── Header ── */
.hdr{padding:20px 16px 0;text-align:center}
.hdr h1{font-size:clamp(1.25rem,5vw,1.75rem);font-weight:700;letter-spacing:-.02em}
.hdr p{color:var(--muted);font-size:.82rem;margin-top:5px}

/* ── Tabs ── */
.tabs{display:flex;gap:8px;justify-content:center;padding:16px 16px 0}
.tab{flex:1;max-width:160px;padding:10px 0;border-radius:99px;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:.88rem;font-weight:600;cursor:pointer;transition:.18s all}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Panels ── */
.panel{display:none;padding:16px 12px calc(80px + var(--safe-b));max-width:860px;margin:0 auto}
.panel.active{display:block}

/* ── Drop zone ── */
.dz{border:2px dashed var(--border);border-radius:var(--r);padding:32px 16px;text-align:center;
  cursor:pointer;transition:.2s all;background:var(--surface);position:relative;margin-bottom:14px}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-dim)}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz .ico{font-size:2rem;margin-bottom:8px}
.dz p{color:var(--muted);font-size:.88rem;line-height:1.5}
.dz strong{color:var(--accent-light)}

/* ── Merge file list ── */
.flist{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:10px;padding:13px 14px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:10px;
  cursor:grab;user-select:none;touch-action:none;transition:.15s}
.fitem:active{cursor:grabbing}
.fitem.dragging{opacity:.4}
.fitem.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.fitem .hdl{color:var(--muted);font-size:1.1rem;flex-shrink:0}
.fitem .nm{flex:1;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .sz{color:var(--muted);font-size:.76rem;flex-shrink:0}
.fitem .xbtn{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1.1rem;padding:2px 6px;border-radius:6px;line-height:1;min-width:32px;min-height:32px;
  display:flex;align-items:center;justify-content:center}
.fitem .xbtn:hover{color:var(--red)}

/* ── Page grid ── */
.pgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(140px,42vw),1fr));
  gap:10px;margin-top:4px
}

/* ── Page card ── */
.pcard{
  background:var(--surface);border:2px solid var(--border);border-radius:10px;
  display:flex;flex-direction:column;user-select:none;position:relative;
  transition:border-color .15s,box-shadow .15s,opacity .15s
}
.pcard.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.pcard.dragging{opacity:.3}
.pcard.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

/* Thumb area — fixed aspect ratio container */
.pthumb{
  background:#ddd;border-radius:8px 8px 0 0;overflow:hidden;
  position:relative;cursor:pointer;
  /* ratio enforced by padding-bottom in JS */
}
.pthumb-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* The canvas is transformed here for live preview */
.pthumb-inner canvas{
  display:block;
  /* width/height set in JS; transform-origin center */
  transform-origin:center center;
  flex-shrink:0;
}

/* ── Card footer ── */
.pfoot{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 6px 5px 8px;border-top:1px solid var(--border);gap:4px;flex-shrink:0
}
.plabel{font-size:.72rem;color:var(--muted);white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pbtns{display:flex;gap:2px;flex-shrink:0}
.pico{
  background:none;border:none;color:var(--muted);cursor:pointer;
  width:30px;height:30px;border-radius:7px;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;
  transition:.12s;flex-shrink:0
}
.pico:hover,.pico:active{background:var(--surface2);color:var(--text)}
.pico.act{color:var(--yellow)}
.pico.del:hover,.pico.del:active{color:var(--red);background:rgba(224,92,92,.12)}

/* Transform badge (bottom-left of thumb) */
.tbadge{
  position:absolute;bottom:5px;left:5px;z-index:2;
  background:rgba(10,12,22,.82);color:var(--yellow);
  font-size:.65rem;padding:2px 5px;border-radius:4px;
  pointer-events:none;white-space:nowrap;
  display:none
}
.tbadge.on{display:block}

/* ── Bottom sheet (scale editor) ── */
.sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s
}
.sheet-bg.open{opacity:1;pointer-events:all}
.sheet{
  background:var(--surface2);border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + var(--safe-b));width:100%;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:75vh;overflow-y:auto
}
.sheet-bg.open .sheet{transform:translateY(0)}
.sheet-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet h3{font-size:1rem;font-weight:600;margin-bottom:4px}
.sheet-sub{color:var(--muted);font-size:.82rem;margin-bottom:20px}

/* Scale presets */
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.preset{
  padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:.85rem;font-weight:500;cursor:pointer;transition:.15s
}
.preset.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.preset:hover:not(.sel){border-color:var(--accent);color:var(--accent-light)}

/* Slider row */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);height:24px;cursor:pointer}
.slider-val{font-size:1rem;font-weight:700;color:var(--accent-light);min-width:46px;text-align:right}

/* Live preview in sheet */
.sheet-preview{
  background:#888;border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  min-height:120px;max-height:200px;margin-bottom:20px;position:relative
}
.sheet-preview canvas{display:block;max-width:100%;max-height:200px;object-fit:contain}
.preview-label{
  position:absolute;bottom:6px;right:8px;
  background:rgba(0,0,0,.6);color:var(--yellow);
  font-size:.7rem;padding:2px 6px;border-radius:4px
}

/* Fill-page button */
.fill-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px;margin-bottom:16px;
  border-radius:10px;border:2px dashed var(--accent);
  background:var(--accent-dim);color:var(--accent-light);
  font-size:.92rem;font-weight:600;cursor:pointer;transition:.18s;
}
.fill-btn:hover,.fill-btn:active{background:rgba(92,110,248,.28);border-style:solid}
.fill-btn span{font-size:1.1rem}
.fill-btn.applied{background:var(--accent);border-color:var(--accent);border-style:solid;color:#fff}

.sheet-actions{display:flex;gap:10px}

/* ── Global buttons ── */
.btn{
  padding:12px 22px;border-radius:99px;border:none;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px
}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-light)}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-g:hover{border-color:var(--accent);color:var(--accent-light)}

/* ── Fixed bottom bar ── */
.bot-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(15,17,23,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 16px calc(10px + var(--safe-b));
  display:flex;gap:10px;align-items:center;z-index:200
}
.bot-bar .btn{flex:1;justify-content:center}

/* ── Status / progress ── */
.st{padding:10px 14px;border-radius:8px;font-size:.85rem;display:none;margin-top:12px}
.st.info{background:var(--accent-dim);color:var(--accent-light);border:1px solid rgba(92,110,248,.3);display:block}
.st.ok{background:rgba(76,175,146,.14);color:var(--green);border:1px solid rgba(76,175,146,.3);display:block}
.st.err{background:rgba(224,92,92,.1);color:var(--red);border:1px solid rgba(224,92,92,.22);display:block}
.pbar{height:4px;background:var(--border);border-radius:4px;margin-top:8px;overflow:hidden;display:none}
.pfill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.sec-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.privacy{text-align:center;color:var(--muted);font-size:.75rem;
  padding:12px 16px calc(90px + var(--safe-b));max-width:480px;margin:0 auto}
.privacy span{color:var(--green)}

/* ── PWA Install Banner ── */
#install-banner{
  position:fixed;top:0;left:0;right:0;z-index:400;
  background:linear-gradient(135deg,#3a4fd4,#5c6ef8);
  color:#fff;padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  transform:translateY(-100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  box-shadow:0 4px 20px rgba(0,0,0,.35)
}
#install-banner.show{transform:translateY(0)}
#install-banner .ib-icon{font-size:1.6rem;flex-shrink:0}
#install-banner .ib-text{flex:1;min-width:0}
#install-banner .ib-text b{display:block;font-size:.9rem;font-weight:700}
#install-banner .ib-text span{font-size:.75rem;opacity:.85}
#install-banner .ib-install{
  background:#fff;color:#5c6ef8;border:none;border-radius:99px;
  padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap
}
#install-banner .ib-close{
  background:none;border:none;color:rgba(255,255,255,.7);font-size:1.1rem;
  cursor:pointer;padding:4px;flex-shrink:0;line-height:1
}

/* ── Offline / Update Toast ── */
#pwa-toast{
  position:fixed;bottom:calc(76px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 18px;font-size:.84rem;color:var(--text);
  box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none;
  white-space:nowrap;z-index:350;display:flex;align-items:center;gap:8px
}
#pwa-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:all}
#pwa-toast .toast-icon{font-size:1rem}
</style>
</head>
<body>

<!-- PWA Install Banner -->
<div id="install-banner">
  <div class="ib-icon">📄</div>
  <div class="ib-text">
    <b>添加到主屏幕</b>
    <span>离线也能使用，像 App 一样方便</span>
  </div>
  <button class="ib-install" id="ib-install-btn">安装</button>
  <button class="ib-close" onclick="dismissInstall()">✕</button>
</div>

<!-- Offline / Update Toast -->
<div id="pwa-toast">
  <span class="toast-icon" id="toast-icon">📶</span>
  <span id="toast-msg">已离线，使用缓存版本</span>
  <button onclick="dismissToast()" style="background:none;border:none;color:var(--muted);cursor:pointer;margin-left:4px;font-size:.9rem">✕</button>
</div>

<div class="hdr">
  <h1>📄 PDF 工具箱</h1>
  <p>合并 · 排序 · 旋转 · 缩放 · 完全本地处理</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('merge')">合并 PDF</button>
  <button class="tab" onclick="switchTab('reorder')">调整页面</button>
</div>

<!-- ═══ MERGE ═══ -->
<div class="panel active" id="panel-merge">
  <div class="dz" id="mdz"
    ondragover="dzOver(event,'mdz')" ondragleave="dzOut('mdz')" ondrop="dzDrop(event,'merge')">
    <input type="file" accept="application/pdf" multiple onchange="addFiles(this.files);this.value=''"/>
    <div class="ico">📂</div>
    <p><strong>点击选择</strong>或拖拽 PDF 文件</p>
    <p style="font-size:.78rem;margin-top:3px">支持同时选择多个文件</p>
  </div>
  <div class="sec-lbl" id="mlbl" style="display:none">文件顺序 — 长按拖拽可调整</div>
  <div class="flist" id="mlist"></div>
  <div class="st" id="mst"></div>
  <div class="pbar" id="mpb"><div class="pfill" id="mpf" style="width:0"></div></div>
</div>

<!-- ═══ REORDER ═══ -->
<div class="panel" id="panel-reorder">
  <div class="dz" id="rdz"
    ondragover="dzOver(event,'rdz')" ondragleave="dzOut('rdz')" ondrop="dzDrop(event,'reorder')">
    <input type="file" accept="application/pdf" onchange="loadPDF(this.files[0]);this.value=''"/>
    <div class="ico">🗂️</div>
    <p><strong>点击选择</strong>或拖拽一个 PDF</p>
    <p style="font-size:.78rem;margin-top:3px">上传后可预览 · 长按拖拽排序 · 旋转 · 缩放</p>
  </div>
  <div class="st" id="rst"></div>
  <div class="pbar" id="rpb"><div class="pfill" id="rpf" style="width:0"></div></div>
  <div class="pgrid" id="pgrid"></div>
</div>

<div class="privacy"><span>🔒 完全本地处理</span> · 文件不上传任何服务器</div>

<!-- ═══ Bottom bar (shared) ═══ -->
<div class="bot-bar" id="bot-bar">
  <!-- content injected by JS -->
</div>

<!-- ═══ Scale bottom sheet ═══ -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-drag"></div>
    <h3 id="sh-title">缩放页面</h3>
    <p class="sheet-sub" id="sh-sub">调整后可在下方预览效果</p>

    <button class="fill-btn" id="sh-fill" onclick="applyFill()">
      <span>⛶</span> 填充满页面
    </button>

    <div class="presets" id="sh-presets">
      <button class="preset" data-v="50" onclick="applyPreset(50)">50%</button>
      <button class="preset" data-v="75" onclick="applyPreset(75)">75%</button>
      <button class="preset" data-v="100" onclick="applyPreset(100)">原始大小</button>
      <button class="preset" data-v="125" onclick="applyPreset(125)">125%</button>
      <button class="preset" data-v="150" onclick="applyPreset(150)">150%</button>
      <button class="preset" data-v="200" onclick="applyPreset(200)">200%</button>
    </div>

    <div class="slider-row">
      <input type="range" id="sh-slider" min="25" max="200" step="5" value="100" oninput="onSlider(this.value)"/>
      <div class="slider-val" id="sh-val">100%</div>
    </div>

    <div class="sheet-preview" id="sh-preview">
      <canvas id="sh-canvas"></canvas>
      <div class="preview-label" id="sh-plabel">100%</div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-p" style="flex:1;justify-content:center" onclick="confirmScale()">应用缩放</button>
      <button class="btn btn-g" onclick="closeSheetBtn()">取消</button>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ════ STATE ════ */
let curTab = 'merge';
// merge
let mFiles = [], mDragSrc = null;
// reorder
let rPages = [];   // {origIdx, pdfJsPage, offW, offH, offCanvas, rotation, scale}
let rOrigBytes = null;
let rDragSrc = null;
// sheet
let sheetIdx = -1, sheetTmpScale = 100;

/* ════ TAB ════ */
function switchTab(t){
  curTab = t;
  document.querySelectorAll('.tab').forEach((el,i)=> el.classList.toggle('active',['merge','reorder'][i]===t));
  document.querySelectorAll('.panel').forEach(p=> p.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  renderBotBar();
}

/* ════ DZ ════ */
function dzOver(e,id){e.preventDefault();document.getElementById(id).classList.add('over')}
function dzOut(id){document.getElementById(id).classList.remove('over')}
function dzDrop(e,mode){
  e.preventDefault(); dzOut(mode==='merge'?'mdz':'rdz');
  const files=[...e.dataTransfer.files].filter(f=>f.type==='application/pdf');
  if(!files.length) return;
  if(mode==='merge') addFiles(files); else loadPDF(files[0]);
}

/* ════ HELPERS ════ */
function fmtSz(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function setSt(id,cls,msg){const el=document.getElementById(id);el.className='st '+cls;el.textContent=msg}
function clrSt(id){document.getElementById(id).className='st';document.getElementById(id).textContent=''}
function setPb(id,v){
  const pb=document.getElementById(id+'pb'??id), pf=document.getElementById(id+'pf'??id);
  // id is prefix like 'm' or 'r'
}
function showPb(pfx,pct){
  const pb=document.getElementById(pfx+'pb'), pf=document.getElementById(pfx+'pf');
  if(pct===null){pb.style.display='none';return}
  pb.style.display='block'; pf.style.width=pct+'%';
}

/* ════ BOTTOM BAR ════ */
function renderBotBar(){
  const bar = document.getElementById('bot-bar');
  if(curTab==='merge'){
    bar.innerHTML=`
      <button class="btn btn-p" id="mbtn" onclick="doMerge()" ${mFiles.length<2?'disabled':''}>
        合并并下载${mFiles.length>=2?' ('+mFiles.length+'个)':''}
      </button>
      <button class="btn btn-g" onclick="clearMerge()">清空</button>`;
  } else {
    if(!rPages.length){
      bar.innerHTML=`<span style="color:var(--muted);font-size:.85rem;flex:1;text-align:center">上传 PDF 后在此操作</span>`;
    } else {
      bar.innerHTML=`
        <button class="btn btn-p" id="rbtn" onclick="doExport()" style="flex:1;justify-content:center">
          导出 PDF（${rPages.length}页）
        </button>
        <button class="btn btn-g" onclick="clearReorder()">重选</button>`;
    }
  }
}

/* ════ MERGE ════ */
function addFiles(fileList){
  [...fileList].filter(f=>f.type==='application/pdf').forEach(f=>mFiles.push({file:f,name:f.name,size:f.size}));
  renderMList(); renderBotBar();
}
function renderMList(){
  const list=document.getElementById('mlist'), lbl=document.getElementById('mlbl');
  list.innerHTML=''; lbl.style.display=mFiles.length?'block':'none';
  mFiles.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='fitem'; d.dataset.idx=i;
    d.innerHTML=`<span class="hdl">⠿</span>
      <span class="nm">📄 ${f.name}</span>
      <span class="sz">${fmtSz(f.size)}</span>
      <button class="xbtn" onclick="rmFile(${i})">✕</button>`;
    // desktop drag
    d.draggable=true;
    d.addEventListener('dragstart',e=>{mDragSrc=i;d.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    d.addEventListener('dragend',()=>{mDragSrc=null;document.querySelectorAll('.fitem').forEach(x=>x.classList.remove('dragging','over'))});
    d.addEventListener('dragover',e=>{e.preventDefault();if(mDragSrc!==null&&mDragSrc!==i)d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');if(mDragSrc!==null&&mDragSrc!==i){mMove(mDragSrc,i)}});
    // touch
    touchSort(d,'fitem',()=>mDragSrc=i,(t)=>{if(t!==null&&t!==i)mMove(mDragSrc,t)},j=>j<mFiles.length?j:null);
    list.appendChild(d);
  });
}
function mMove(f,t){const it=mFiles.splice(f,1)[0];mFiles.splice(t,0,it);renderMList();renderBotBar()}
function rmFile(i){mFiles.splice(i,1);renderMList();renderBotBar()}
function clearMerge(){mFiles=[];renderMList();renderBotBar();clrSt('mst');showPb('m',null)}

async function doMerge(){
  if(mFiles.length<2){setSt('mst','err','请至少选择 2 个 PDF 文件');return}
  const btn=document.getElementById('mbtn');
  btn.innerHTML='<span class="spin"></span> 合并中…'; btn.disabled=true;
  clrSt('mst'); showPb('m',5);
  try{
    const {PDFDocument}=PDFLib, out=await PDFDocument.create();
    for(let i=0;i<mFiles.length;i++){
      const ab=await mFiles[i].file.arrayBuffer();
      const src=await PDFDocument.load(ab,{ignoreEncryption:true});
      const pages=await out.copyPages(src,src.getPageIndices());
      pages.forEach(p=>out.addPage(p));
      showPb('m',Math.round(10+80*(i+1)/mFiles.length));
    }
    showPb('m',95);
    dl(await out.save(),'merged.pdf');
    showPb('m',100);
    setSt('mst','ok',`✅ 合并完成！共 ${mFiles.length} 个文件，已开始下载。`);
  }catch(e){setSt('mst','err','❌ 合并失败：'+e.message)}
  finally{renderBotBar();setTimeout(()=>showPb('m',null),2000)}
}

/* ════ REORDER / ROTATE / SCALE ════ */
const RENDER_W = 280; // offscreen render width in px

async function loadPDF(file){
  if(!file||file.type!=='application/pdf'){setSt('rst','err','请选择 PDF 文件');return}
  clearReorder(false);
  setSt('rst','info','正在加载 PDF，请稍候…'); showPb('r',5);
  try{
    rOrigBytes = await file.arrayBuffer();
    const pdfjs = await pdfjsLib.getDocument({data:rOrigBytes.slice(0)}).promise;
    const total = pdfjs.numPages; rPages=[];
    for(let i=1;i<=total;i++){
      const pg=await pdfjs.getPage(i);
      const vp0=pg.getViewport({scale:1});
      const sc=RENDER_W/vp0.width;
      const vp=pg.getViewport({scale:sc});
      const oc=document.createElement('canvas');
      oc.width=Math.round(vp.width); oc.height=Math.round(vp.height);
      await pg.render({canvasContext:oc.getContext('2d'),viewport:vp}).promise;
      rPages.push({origIdx:i-1, pdfJsPage:pg, offW:oc.width, offH:oc.height, offCanvas:oc, rotation:0, scale:1});
      showPb('r',Math.round(5+88*(i/total)));
    }
    showPb('r',98); renderGrid(); clrSt('rst'); showPb('r',null);
    renderBotBar();
  }catch(e){setSt('rst','err','❌ 加载失败：'+e.message);showPb('r',null)}
}

function renderGrid(){
  const grid=document.getElementById('pgrid'); grid.innerHTML='';
  rPages.forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='pcard'; card.dataset.idx=i;

    /* thumb */
    const thumbWrap=document.createElement('div');
    thumbWrap.className='pthumb';

    // Aspect ratio: account for rotation
    const rot=p.rotation; const swapped=(rot===90||rot===270);
    const natW=swapped?p.offH:p.offW, natH=swapped?p.offW:p.offH;
    // Pad-bottom trick for aspect ratio
    thumbWrap.style.paddingBottom=(natH/natW*100)+'%';
    thumbWrap.style.height='0'; thumbWrap.style.position='relative';

    const inner=document.createElement('div');
    inner.className='pthumb-inner';

    // Visible canvas – we'll paint into it
    const vis=document.createElement('canvas');
    // Rotate & scale in canvas pixels
    const sc=p.scale;
    if(swapped){ vis.width=Math.round(p.offH*sc); vis.height=Math.round(p.offW*sc); }
    else       { vis.width=Math.round(p.offW*sc); vis.height=Math.round(p.offH*sc); }
    const ctx=vis.getContext('2d');
    ctx.save();
    ctx.translate(vis.width/2, vis.height/2);
    ctx.rotate(rot*Math.PI/180);
    ctx.drawImage(p.offCanvas, -p.offW*sc/2, -p.offH*sc/2, p.offW*sc, p.offH*sc);
    ctx.restore();

    // CSS: fit canvas into the thumb box
    vis.style.width='100%'; vis.style.height='100%';
    vis.style.objectFit='contain';
    inner.appendChild(vis);

    // badge
    const badge=document.createElement('div');
    badge.className='tbadge'+(rot!==0||p.scale!==1?' on':'');
    const parts=[];
    if(rot!==0) parts.push(rot+'°');
    if(p.scale!==1) parts.push(Math.round(p.scale*100)+'%');
    badge.textContent=parts.join(' · ');
    inner.appendChild(badge);

    thumbWrap.appendChild(inner);
    card.appendChild(thumbWrap);

    /* footer */
    const foot=document.createElement('div'); foot.className='pfoot';
    const lbl=document.createElement('div'); lbl.className='plabel'; lbl.textContent='第'+(i+1)+'页';
    const btns=document.createElement('div'); btns.className='pbtns';

    const mkBtn=(txt,title,cls,cb)=>{
      const b=document.createElement('button'); b.className='pico '+cls; b.title=title; b.textContent=txt;
      b.onclick=e=>{e.stopPropagation();cb();};
      return b;
    };
    btns.appendChild(mkBtn('↺','逆时针旋转',rot!==0?'act':''  ,()=>rotatePage(i,-90)));
    btns.appendChild(mkBtn('↻','顺时针旋转',rot!==0?'act':''  ,()=>rotatePage(i,+90)));
    btns.appendChild(mkBtn('⤢','缩放',p.scale!==1?'act':''    ,()=>openSheet(i)));
    btns.appendChild(mkBtn('🗑','删除此页','del'               ,()=>deletePage(i)));

    foot.appendChild(lbl); foot.appendChild(btns);
    card.appendChild(foot);

    /* drag – desktop */
    thumbWrap.draggable=true;
    thumbWrap.addEventListener('dragstart',e=>{rDragSrc=i;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    thumbWrap.addEventListener('dragend',()=>{rDragSrc=null;document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('dragging','over'))});
    card.addEventListener('dragover',e=>{e.preventDefault();if(rDragSrc!==null&&rDragSrc!==i)card.classList.add('over')});
    card.addEventListener('dragleave',()=>card.classList.remove('over'));
    card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('over');if(rDragSrc!==null&&rDragSrc!==i)movePage(rDragSrc,i)});

    /* drag – touch */
    touchSort(thumbWrap,'pcard',()=>rDragSrc=i,(t)=>{if(t!==null&&t!==i)movePage(rDragSrc,t)},j=>j<rPages.length?j:null);

    grid.appendChild(card);
  });
}

function rotatePage(i,d){rPages[i].rotation=((rPages[i].rotation+d)%360+360)%360;renderGrid()}
function movePage(f,t){const it=rPages.splice(f,1)[0];rPages.splice(t,0,it);renderGrid()}
function deletePage(i){if(rPages.length<=1){setSt('rst','err','至少保留一页');return}rPages.splice(i,1);renderGrid();renderBotBar()}
function clearReorder(full=true){
  rPages=[];rOrigBytes=null;
  document.getElementById('pgrid').innerHTML='';
  clrSt('rst');showPb('r',null);
  if(full)renderBotBar();
}

async function doExport(){
  if(!rOrigBytes||!rPages.length) return;
  const btn=document.getElementById('rbtn');
  btn.innerHTML='<span class="spin"></span> 导出中…'; btn.disabled=true;
  setSt('rst','info','正在导出…'); showPb('r',5);
  try{
    const {PDFDocument,degrees}=PDFLib;
    const src=await PDFDocument.load(rOrigBytes.slice(0),{ignoreEncryption:true});
    const out=await PDFDocument.create();
    const idxs=rPages.map(p=>p.origIdx);
    const copied=await out.copyPages(src,idxs);
    showPb('r',50);
    copied.forEach((pg,i)=>{
      const info=rPages[i];
      const ex=(pg.getRotation().angle||0);
      pg.setRotation(degrees((ex+info.rotation)%360));
      if(info.scale!==1){ pg.scaleContent(info.scale,info.scale); }
      out.addPage(pg);
    });
    showPb('r',85);
    dl(await out.save(),'output.pdf');
    showPb('r',100);
    setSt('rst','ok','✅ 导出完成，已开始下载！');
  }catch(e){setSt('rst','err','❌ 导出失败：'+e.message)}
  finally{renderBotBar();setTimeout(()=>showPb('r',null),2000)}
}

/* ════ SCALE SHEET ════ */
let sheetFillPct = 100; // computed "fill page" scale for current sheet page

function openSheet(i){
  sheetIdx=i; sheetTmpScale=Math.round(rPages[i].scale*100);
  document.getElementById('sh-title').textContent='缩放 — 第'+(i+1)+'页';
  document.getElementById('sh-slider').value=sheetTmpScale;
  document.getElementById('sh-val').textContent=sheetTmpScale+'%';

  // Compute fill-page scale:
  // The offscreen canvas was rendered at RENDER_W px wide (scale=1 in our system).
  // The PDF page natural size in points is available via pdfJsPage.getViewport({scale:1}).
  // "Fill page" means: after rotation, the content exactly covers the page dimensions.
  // rotation 90/270 swaps width↔height, so fill = pageH/pageW ratio applied to content.
  // Since our offCanvas already represents the full page at scale=1, fill is always 1 (100%)
  // in the un-rotated case. The useful "fill" is when the user wants to stretch a rotated
  // page back to fill the original media box — i.e. scale = pageW/pageH (swap back).
  // More intuitively: fill = the scale that makes the *rotated* content fill the media box.
  const p = rPages[i];
  const vp = p.pdfJsPage.getViewport({scale:1});
  const pageW = vp.width, pageH = vp.height;
  const rot = p.rotation; const swapped = (rot===90||rot===270);
  // After rotation, content effective dims are swapped. To fill the media box:
  // fillScale = min(pageW / contentW_after_rot, pageH / contentH_after_rot)
  // contentW_after_rot at scale=1: swapped ? pageH : pageW → same as page, so fill=1 when not rotated.
  // When rotated 90°: content is pageH wide, pageW tall → to fill pageW×pageH box:
  //   fillW = pageW/pageH, fillH = pageH/pageW → min of these
  let fillScale;
  if(swapped){
    fillScale = Math.min(pageW/pageH, pageH/pageW);
    // actually we want to FILL (cover), not fit:
    fillScale = Math.max(pageW/pageH, pageH/pageW);
  } else {
    fillScale = 1; // content already fills page at 100%
  }
  sheetFillPct = Math.min(200, Math.max(25, Math.round(fillScale*100/5)*5));

  // Update fill button label
  const fillBtn = document.getElementById('sh-fill');
  fillBtn.classList.toggle('applied', sheetTmpScale===sheetFillPct);
  fillBtn.innerHTML=`<span>⛶</span> 填充满页面 <span style="font-size:.8rem;opacity:.8">(${sheetFillPct}%)</span>`;

  syncPresetBtns(sheetTmpScale);
  renderSheetPreview(sheetTmpScale);
  document.getElementById('sheet-bg').classList.add('open');
  document.body.style.overflow='hidden';
}

function applyFill(){
  applyPreset(sheetFillPct);
  document.getElementById('sh-fill').classList.add('applied');
}
function closeSheet(e){
  if(e&&e.target!==document.getElementById('sheet-bg')) return;
  _closeSheet();
}
function closeSheetBtn(){ _closeSheet(); }
function _closeSheet(){
  document.getElementById('sheet-bg').classList.remove('open');
  document.body.style.overflow='';
}
function confirmScale(){
  if(sheetIdx<0) return;
  rPages[sheetIdx].scale=sheetTmpScale/100;
  _closeSheet();
  renderGrid();
}
function applyPreset(v){
  sheetTmpScale=v;
  document.getElementById('sh-slider').value=v;
  document.getElementById('sh-val').textContent=v+'%';
  syncPresetBtns(v);
  syncFillBtn(v);
  renderSheetPreview(v);
}
function onSlider(v){
  sheetTmpScale=parseInt(v);
  document.getElementById('sh-val').textContent=v+'%';
  syncPresetBtns(parseInt(v));
  syncFillBtn(parseInt(v));
  renderSheetPreview(parseInt(v));
}
function syncFillBtn(v){
  document.getElementById('sh-fill').classList.toggle('applied', v===sheetFillPct);
}
function syncPresetBtns(v){
  document.querySelectorAll('.preset').forEach(b=> b.classList.toggle('sel',parseInt(b.dataset.v)===v));
}

function renderSheetPreview(scalePct){
  if(sheetIdx<0) return;
  const p=rPages[sheetIdx];
  const sc=scalePct/100;
  const rot=p.rotation; const swapped=(rot===90||rot===270);
  const oc=p.offCanvas;

  const previewMaxW=Math.min(document.getElementById('sh-preview').clientWidth-32, 400);
  const previewMaxH=180;

  // Compute display canvas size
  const rawW=swapped?oc.height*sc:oc.width*sc;
  const rawH=swapped?oc.width*sc:oc.height*sc;
  const fit=Math.min(previewMaxW/rawW, previewMaxH/rawH, 1);
  const cW=Math.round(rawW*fit), cH=Math.round(rawH*fit);

  const cv=document.getElementById('sh-canvas');
  cv.width=cW; cv.height=cH;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cW,cH);
  ctx.save();
  ctx.translate(cW/2,cH/2);
  ctx.rotate(rot*Math.PI/180);
  const drawW=swapped?cH:cW, drawH=swapped?cW:cH;
  ctx.drawImage(oc,-drawW/2,-drawH/2,drawW,drawH);
  ctx.restore();

  document.getElementById('sh-plabel').textContent=scalePct+'%';
}

/* ════ DOWNLOAD ════ */
function dl(bytes,name){
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

/* ════ TOUCH SORT ════ */
function touchSort(handle, cardClass, onStart, onDrop, idxFn){
  let ghost=null;
  handle.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    const card=handle.closest('.'+cardClass);
    if(!card) return;
    const idx=parseInt(card.dataset.idx); if(isNaN(idx)) return;
    onStart(idx);
    const t=e.touches[0]; const r=card.getBoundingClientRect();
    ghost=card.cloneNode(true);
    // Remove canvas content issue: re-draw
    ghost.querySelectorAll('canvas').forEach(c=>c.getContext('2d').clearRect(0,0,c.width,c.height));
    ghost.style.cssText=`position:fixed;width:${r.width}px;height:${r.height}px;
      left:${r.left}px;top:${r.top}px;opacity:.65;pointer-events:none;z-index:9999;
      border:2px solid var(--accent);border-radius:10px;transform:scale(1.04);background:var(--surface2)`;
    document.body.appendChild(ghost);
    card.classList.add('dragging');
  },{passive:true});
  handle.addEventListener('touchmove',e=>{
    if(!ghost) return; e.preventDefault();
    const t=e.touches[0];
    ghost.style.left=(t.clientX-ghost.offsetWidth/2)+'px';
    ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
    document.querySelectorAll('.'+cardClass).forEach(c=>c.classList.remove('over'));
    const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.'+cardClass);
    if(el) el.classList.add('over');
  },{passive:false});
  handle.addEventListener('touchend',e=>{
    if(!ghost) return;
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.'+cardClass);
    let tIdx=null;
    if(el){ const raw=parseInt(el.dataset.idx); tIdx=idxFn(raw); }
    ghost.remove(); ghost=null;
    document.querySelectorAll('.'+cardClass).forEach(c=>c.classList.remove('dragging','over'));
    onDrop(tIdx);
  });
}

/* init */
renderBotBar();

/* ════ PWA: Service Worker ════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Use relative path so it works under any GitHub Pages repo name
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
      // New SW waiting → show update toast
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showToast('🔄', '新版本已就绪，刷新后生效', 6000, () => location.reload());
          }
        });
      });
    }).catch(e => console.warn('SW register failed:', e));
  });
}

/* ════ PWA: Install prompt ════ */
let _deferredPrompt = null;
const banner = document.getElementById('install-banner');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredPrompt = e;
  // Don't show if user dismissed before
  if (!localStorage.getItem('pwa-install-dismissed')) {
    setTimeout(() => banner.classList.add('show'), 1200);
  }
});

document.getElementById('ib-install-btn').addEventListener('click', async () => {
  if (!_deferredPrompt) return;
  _deferredPrompt.prompt();
  const { outcome } = await _deferredPrompt.userChoice;
  _deferredPrompt = null;
  banner.classList.remove('show');
  if (outcome === 'accepted') showToast('✅', '已添加到主屏幕！');
});

window.addEventListener('appinstalled', () => {
  banner.classList.remove('show');
  _deferredPrompt = null;
  showToast('✅', '安装成功，可从主屏幕启动');
});

function dismissInstall() {
  banner.classList.remove('show');
  localStorage.setItem('pwa-install-dismissed', '1');
}

/* ════ PWA: Offline / Online detection ════ */
window.addEventListener('offline', () => showToast('📵', '已离线，仍可处理本地文件', 0));
window.addEventListener('online',  () => showToast('✅', '已恢复网络连接', 3000));

/* ════ Toast helper ════ */
let _toastTimer = null;
function showToast(icon, msg, duration = 4000, onClick = null) {
  const toast = document.getElementById('pwa-toast');
  document.getElementById('toast-icon').textContent = icon;
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  if (onClick) { toast.style.cursor = 'pointer'; toast.onclick = onClick; }
  else { toast.style.cursor = ''; toast.onclick = null; }
  clearTimeout(_toastTimer);
  if (duration > 0) _toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}
function dismissToast() {
  clearTimeout(_toastTimer);
  document.getElementById('pwa-toast').classList.remove('show');
}
